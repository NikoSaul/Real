<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ÉCRITURE</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#070707;--surface:#0d0d0d;--surface2:#131313;--border:#1a1a1a;--border2:#242424;--text:#d5d0c8;--text-muted:#5c5853;--text-dim:#333130;--accent:#c8a86e;--accent-dim:rgba(200,168,110,0.08);--red:#8b3535;--r:2px;--fd:'Playfair Display',Georgia,serif;--fb:'Crimson Pro',Georgia,serif;--fm:'IBM Plex Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:18px;line-height:1.7;min-height:100vh}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.018;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:rgba(7,7,7,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 2rem;height:52px;display:flex;align-items:center;justify-content:space-between}
.nav-left{display:flex;align-items:center;gap:.4rem}
.nav-brand{font-family:var(--fm);font-size:11px;font-weight:400;letter-spacing:.22em;color:var(--text-muted);text-transform:uppercase;cursor:pointer;transition:color .2s}
.nav-brand:hover{color:var(--accent)}
.nav-bc{font-family:var(--fm);font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:.4rem}
.nav-bc .crumb{cursor:pointer;transition:color .2s}.nav-bc .crumb:hover{color:var(--accent)}
.nav-actions{display:flex;gap:.4rem;align-items:center}

/* BUTTONS */
.btn{font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;border:1px solid var(--border2);background:transparent;color:var(--text-muted);cursor:pointer;border-radius:var(--r);transition:all .2s}
.btn:hover{border-color:var(--text-muted);color:var(--text)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-accent{border-color:var(--accent);color:var(--accent)}
.btn-accent:hover{background:var(--accent);color:var(--bg)}
.btn-ghost{border-color:transparent}.btn-ghost:hover{border-color:var(--border2)}
.btn-danger{color:var(--red);border-color:var(--red)}.btn-danger:hover{background:var(--red);color:#fff}
.ibtn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;color:var(--text-muted);cursor:pointer;border-radius:var(--r);transition:all .2s;font-size:13px}
.ibtn:hover{border-color:var(--border2);color:var(--text)}

/* VIEWS */
.view{display:none}.view.active{display:block}

/* HOME */
.home{min-height:calc(100vh - 52px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 2rem}
.home-header{text-align:center;margin-bottom:5rem}
.home-eyebrow{font-family:var(--fm);font-size:10px;letter-spacing:.3em;color:var(--text-dim);text-transform:uppercase;margin-bottom:1.2rem}
.home-title{font-family:var(--fd);font-size:clamp(3.5rem,9vw,7.5rem);font-weight:900;letter-spacing:-.02em;line-height:1}
.home-title span{font-style:italic;color:var(--accent)}
.home-sub{font-family:var(--fm);font-size:10px;letter-spacing:.2em;color:var(--text-dim);text-transform:uppercase;margin-top:1.5rem}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;width:100%;max-width:880px}
.cat-card{background:var(--surface);border:1px solid var(--border);padding:2.5rem 2rem;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.cat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:0;transition:opacity .25s}
.cat-card[data-c="personnage"]::before{background:#8b5c3c}
.cat-card[data-c="structure"]::before{background:#3c5e8b}
.cat-card[data-c="realisateur"]::before{background:#3c7c0e}
.cat-card[data-c="exercices"]::before{background:#3c7a5e}
.cat-card:hover{background:var(--surface2)}.cat-card:hover::before{opacity:1}
.cat-idx{font-family:var(--fm);font-size:10px;color:var(--text-dim);letter-spacing:.2em;margin-bottom:1.5rem}
.cat-name{font-family:var(--fd);font-size:1.5rem;font-weight:700;margin-bottom:.4rem}
.cat-desc{font-family:var(--fm);font-size:10px;color:var(--text-muted);letter-spacing:.04em}
.cat-cnt{font-family:var(--fm);font-size:10px;color:var(--text-dim);margin-top:2rem}

/* CATEGORY VIEW */
.cv{max-width:900px;margin:0 auto;padding:3rem 2rem}
.cv-header{margin-bottom:3rem;padding-bottom:2rem;border-bottom:1px solid var(--border)}
.cv-label{font-family:var(--fm);font-size:10px;letter-spacing:.25em;color:var(--text-muted);text-transform:uppercase;margin-bottom:1rem}
.cv-title{font-family:var(--fd);font-size:clamp(2rem,5vw,3.5rem);font-weight:900;font-style:italic}
.c-list{display:flex;flex-direction:column;gap:1px}
.c-item{background:var(--surface);border:1px solid var(--border);padding:1.4rem 2rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.c-item:hover{background:var(--surface2);border-color:var(--border2)}
.c-item-l{flex:1}
.c-item-idx{font-family:var(--fm);font-size:10px;color:var(--text-dim);letter-spacing:.15em;margin-bottom:.35rem}
.c-item-title{font-family:var(--fd);font-size:1.05rem;font-weight:600}
.c-item-meta{font-family:var(--fm);font-size:10px;color:var(--text-muted);margin-top:.35rem}
.c-item-actions{display:flex;gap:.2rem;opacity:0;transition:opacity .2s}
.c-item:hover .c-item-actions{opacity:1}
.add-btn{margin-top:2rem;width:100%;padding:1.2rem 2rem;background:transparent;border:1px dashed var(--border2);color:var(--text-muted);font-family:var(--fm);font-size:11px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:all .2s;border-radius:var(--r)}
.add-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}

/* COURSE VIEW */
.course-view{max-width:780px;margin:0 auto;padding:3rem 2rem 6rem}
.course-title{font-family:var(--fd);font-size:clamp(1.6rem,4vw,2.6rem);font-weight:700;line-height:1.2;margin-bottom:.7rem}
.course-meta{font-family:var(--fm);font-size:10px;letter-spacing:.15em;color:var(--text-muted);text-transform:uppercase;display:flex;align-items:center;gap:1rem;margin-bottom:2.5rem;padding-bottom:2rem;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ctag{display:inline-block;padding:2px 8px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;border-radius:1px}
.ctag.personnage{background:rgba(139,92,60,.15);color:#c4845a;border:1px solid rgba(139,92,60,.25)}
.ctag.structure{background:rgba(60,94,139,.15);color:#6e9bc4;border:1px solid rgba(60,94,139,.25)}
.ctag.realisateur{background:rgba(60,100,30,.15);color:#6ec4a0;border:1px solid rgba(60,122,94,.25)}
.ctag.exercices{background:rgba(60,122,94,.15);color:#6ec4a0;border:1px solid rgba(60,122,94,.25)}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:2.5rem}
.tab{font-family:var(--fm);font-size:11px;letter-spacing:.15em;text-transform:uppercase;padding:.75rem 1.4rem;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text-muted);cursor:pointer;transition:all .2s;margin-bottom:-1px}
.tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* CONTENT */
.course-content{font-family:var(--fb);font-size:18px;line-height:1.85;color:var(--text)}
.course-content h3{font-family:var(--fd);font-size:1.35rem;font-weight:700;margin:2.5rem 0 1rem;padding-top:1rem;border-top:1px solid var(--border)}
.course-content h4{font-family:var(--fd);font-size:1.05rem;font-style:italic;font-weight:600;margin:1.75rem 0 .6rem;color:var(--accent)}
.course-content p{margin-bottom:1rem}
.course-content strong{color:var(--text);font-weight:600}
.course-content em{font-style:italic;color:#b5b0a8}
.course-content blockquote{border-left:2px solid var(--border2);padding:1rem 1.5rem;margin:1.25rem 0;color:#a8a39b;font-style:italic;background:var(--surface)}
.course-content hr{border:none;border-top:1px solid var(--border);margin:2rem 0}
.course-content br{display:block;content:'';margin:.2rem 0}

/* FLASHCARDS */
.fc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.fc-cnt{font-family:var(--fm);font-size:11px;color:var(--text-muted)}
.fc-actions{display:flex;gap:.5rem}
.fc-list{display:flex;flex-direction:column;gap:1px}
.fc-item{background:var(--surface);border:1px solid var(--border)}
.fc-q{padding:.9rem 1.4rem;font-family:var(--fm);font-size:13px;color:var(--text);border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
.fc-ql{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);flex-shrink:0;margin-top:2px;opacity:.7}
.fc-a{padding:.9rem 1.4rem;font-family:var(--fb);font-size:16px;color:var(--text-muted);display:flex;align-items:flex-start;gap:.75rem}
.fc-al{font-family:var(--fm);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);flex-shrink:0;margin-top:2px}
.fc-editor{padding:1.2rem;background:var(--bg);border:1px solid var(--border2)}

/* STUDY */
.study-view{min-height:calc(100vh - 52px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
.study-prog{font-family:var(--fm);font-size:11px;color:var(--text-muted);letter-spacing:.15em;margin-bottom:2rem}
.study-card{width:100%;max-width:620px;perspective:1000px;cursor:pointer;margin-bottom:1.5rem}
.study-card-inner{position:relative;width:100%;min-height:260px;transition:transform .55s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.study-card.flipped .study-card-inner{transform:rotateY(180deg)}
.study-f,.study-b{position:absolute;width:100%;min-height:260px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.study-f{background:var(--surface);border:1px solid var(--border2)}
.study-b{transform:rotateY(180deg);background:var(--surface2);border:1px solid rgba(200,168,110,.3)}
.study-label{font-family:var(--fm);font-size:9px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:1.5rem}
.study-f .study-label{color:var(--accent);opacity:.55}
.study-b .study-label{color:var(--accent)}
.study-text{font-family:var(--fb);font-size:1.15rem;line-height:1.6}
.study-f .study-text{font-family:var(--fm);font-size:.95rem}
.study-hint{font-family:var(--fm);font-size:10px;color:var(--text-dim);letter-spacing:.1em;margin-bottom:2rem;min-height:1.2em}
.study-ctrl{display:flex;gap:1rem;align-items:center}

/* SUMMARY */
.sum-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.sum-content{font-family:var(--fb);font-size:17px;line-height:1.85;color:var(--text)}
.sum-content h3{font-family:var(--fd);font-size:1.1rem;font-weight:700;margin:1.5rem 0 .5rem;color:var(--accent)}
.sum-content p{margin-bottom:.85rem}
.sum-content strong{color:var(--text);font-weight:600}

/* EMPTY / GENERATING */
.empty{text-align:center;padding:4rem 2rem;color:var(--text-muted)}
.empty p{font-family:var(--fm);font-size:12px;letter-spacing:.1em;margin-bottom:1.5rem}
.empty-btns{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
.generating{display:flex;align-items:center;gap:.75rem;font-family:var(--fm);font-size:11px;color:var(--accent);padding:2rem 0}
.dot-pulse{display:flex;gap:4px}
.dot-pulse span{width:4px;height:4px;background:var(--accent);border-radius:50%;animation:dp 1.2s ease-in-out infinite}
.dot-pulse span:nth-child(2){animation-delay:.2s}.dot-pulse span:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,60%,100%{opacity:.2;transform:scale(.8)}30%{opacity:1;transform:scale(1)}}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;align-items:flex-start;justify-content:center;padding:2rem;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);width:100%;max-width:660px;margin:auto}
.modal-header{padding:1.4rem 2rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:var(--fm);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.modal-body{padding:2rem}
.modal-footer{padding:1.4rem 2rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.75rem}
.fg{margin-bottom:1.5rem}
.fg label{font-family:var(--fm);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:.5rem}
.fi,.fsel,.fta{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);font-family:var(--fb);font-size:16px;padding:.7rem 1rem;border-radius:var(--r);transition:border-color .2s;outline:none}
.fi:focus,.fsel:focus,.fta:focus{border-color:var(--accent)}
.fta{min-height:200px;resize:vertical;line-height:1.6}
.fsel{font-family:var(--fm);font-size:13px}

/* SETTINGS */
.set-row{display:flex;align-items:flex-start;gap:1.5rem;padding:1.5rem 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-row-l{flex:1}
.set-row-title{font-family:var(--fm);font-size:12px;color:var(--text);margin-bottom:.3rem}
.set-row-desc{font-family:var(--fm);font-size:10px;color:var(--text-muted);letter-spacing:.04em}

/* TOAST */
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--surface2);border:1px solid var(--border2);padding:.7rem 1.2rem;font-family:var(--fm);font-size:11px;color:var(--text);z-index:2000;opacity:0;transform:translateY(6px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{border-color:#3c7a5e;color:#6ec4a0}
.toast.error{border-color:var(--red);color:#c47070}

::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

@media(max-width:640px){.cat-grid{grid-template-columns:1fr}.cv,.course-view{padding:1.5rem 1rem 4rem}}
</style>
</head>
<body>
<div id="app">
  <nav class="nav">
    <div class="nav-left">
      <span class="nav-brand" onclick="goHome()">ÉCRITURE</span>
      <div class="nav-bc" id="breadcrumb"></div>
    </div>
    <div class="nav-actions">
      <button class="btn btn-ghost" onclick="openSettings()" title="Paramètres">⚙</button>
      <button class="btn" onclick="exportData()">Export</button>
      <label class="btn" style="cursor:pointer">Import<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label>
    </div>
  </nav>

  <!-- HOME -->
  <div id="view-home" class="view active">
    <div class="home">
      <div class="home-header">
        <div class="home-eyebrow">Notes de cours</div>
        <h1 class="home-title">Écri<span>ture</span></h1>
        <div class="home-sub">Personnage · Structure · Realisateur · Exercices</div>
      </div>
      <div class="cat-grid" id="cat-grid"></div>
    </div>
  </div>

  <!-- CATEGORY -->
  <div id="view-category" class="view">

      <div class="cv-header">

  <!-- STUDY -->
  <div id="view-study" class="view">
    <div class="study-view" id="study-inner"></div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="overlay" id="edit-overlay" onclick="overlayClick(event,'edit-overlay')">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="edit-modal-title">Ajouter un cours</span>
      <button class="ibtn" onclick="closeEdit()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <div class="fg"><label>Titre</label><input type="text" class="fi" id="edit-title" placeholder="Titre du cours"></div>
      <div class="fg">
        <label>Catégorie</label>
        <select class="fsel" id="edit-cat">
          <option value="personnage">Personnage</option>
          <option value="structure">Structure</option>
          <option value="realisateur">Realisateur</option>
          <option value="exercices">Exercices</option>
        </select>
      </div>
      <div class="fg"><label>Contenu (Markdown : ###, ####, **gras**, *italique*, &gt; citation, ---)</label><textarea class="fta" id="edit-content" style="min-height:300px"></textarea></div>
      <div class="fg"><label>Résumé (optionnel — laisser vide pour générer via Claude)</label><textarea class="fta" id="edit-summary" style="min-height:110px"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeEdit()">Annuler</button>
      <button class="btn btn-accent" onclick="saveEdit()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="overlay" id="settings-overlay" onclick="overlayClick(event,'settings-overlay')">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Paramètres</span>
      <button class="ibtn" onclick="closeSettings()">✕</button>
    </div>
    <div class="modal-body">
      <div class="set-row">
        <div class="set-row-l">
          <div class="set-row-title">Clé API Anthropic</div>
          <div class="set-row-desc">Nécessaire pour générer flashcards et résumés via Claude</div>
        </div>
        <div style="flex:1.2"><input type="password" class="fi" id="set-api-key" placeholder="sk-ant-..."></div>
      </div>
      <div class="set-row">
        <div class="set-row-l">
          <div class="set-row-title">Réinitialiser les données</div>
          <div class="set-row-desc">Recharge les cours d'origine. Action irréversible.</div>
        </div>
        <button class="btn btn-danger" onclick="confirmReset()">Reset</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeSettings()">Fermer</button>
      <button class="btn btn-accent" onclick="saveSettings()">Sauvegarder</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
// DEFAULT DATA
// ═══════════════════════════════════════════════
const DEFAULT_COURSES = [
{id:'p1',title:'La psychologie des personnages',category:'personnage',content:`### La psychologie des personnages

*John York, 'Into the woods' : Les personnages entreprennent un voyage pour reconnaître et assimiler les traumatismes de leur passé. En affrontant et acceptant la cause de leurs traumatismes, ils peuvent enfin aller de l'avant.*

Écrire un personnage principal avec des faiblesses et des traumatismes, et des secondaires qui servent à affaiblir ses défenses pour provoquer une **catharsis** au personnage et à l'audience.

#### La Faiblesse

Quand le personnage n'a pas conscience de ses propres faiblesses, mais que le spectateur, lui, les voit.

**Exemple :** Il a du mal à s'ouvrir aux autres. *"La conviction que sortir de sa zone de confort entraînerait une souffrance émotionnelle."*

#### Le Trauma

Répond directement à la faiblesse.

**Exemple :** Abusé par son père.

#### Le Système de Défense

La part qu'on voit en premier chez un personnage. Il peut changer de sujet quand c'est trop profond, contre-attaquer sur un sujet qui touche l'autre (sans le savoir forcément). Ce système finira par disparaître à la fin.

#### Vaincre les Défenses

Un personnage qui croit en lui force l'autre à sortir de sa zone de confort. Les personnages secondaires l'aident ou pas à voir ses mécanismes.

**Exemple de dialogue :**

> Femme : "Tu veux emménager avec moi ?"
> Homme : "Tu vas te rendre compte de mes défauts... et j'ai un taf là..."
> Femme : "Tu as peur que je ne t'aime pas en retour. Et tu sais quoi, j'ai peur aussi. Fuck it, je tente le coup — au moins je suis honnête avec toi."

#### La Régression

Retourner à un état de bien-être facile où on n'a pas besoin de bouger. Exemple : retourner chez ses parents, retrouver son groupe d'amis.

#### Le Déni

Le personnage refuse de voir ce qu'il devrait voir.

> "T'es mon meilleur pote alors prends-le pas mal, mais si dans 20 ans tu vis encore ici et tu continues de bosser sur les chantiers, je te tue. Tu as X compétence entre les mains. Ça serait une insulte si t'étais encore là dans 20 ans."

#### La Catharsis

Purification et libération des sentiments. Il détruit tous les murs. **Vu qu'on a vécu le chemin avec lui, le public vit aussi une catharsis dramatique.**`,summary:'',flashcards:[],createdAt:'2025-01-01',updatedAt:'2025-01-01'},
{id:'p2',title:'Créer de la lumière dans l\'obscurité',category:'personnage',content:`### Créer de la lumière dans l'obscurité

*"L'évolution d'un personnage influence non seulement la structure, mais aussi le thème de l'histoire."*

**Thème de Seven :** Le monde est rempli de douleur et de personnages effroyables, mais il est aussi bon, et vaut la peine de se battre.

#### Les Croyances du Protagoniste

Freeman est devenu cynique. Repoussé par l'apathie qu'il voit chaque jour, il croit ne plus pouvoir se battre. Il se laisse gagner par *l'apathie (incapacité d'être ému ou de réagir)*. C'est son mensonge.

Il a une expérience passée qui l'a façonné ainsi. On appelle ça **le personnage Fantôme**.

#### Le Personnage Fantôme

Un personnage hanté par son passé. Une blessure qui le poursuit.

*"Les blessures sont souvent gardées secrètes, car il y a un mensonge attaché. Un mensonge auquel croit le personnage à propos de lui-même."*

Freeman a une blessure liée à son enfant jamais né. Son fantôme. *"Comment vouloir un enfant dans un monde comme celui-ci ?"* — son conflit intérieur est lié au thème.

Le mensonge dans son fantôme :

> "Je suis certain d'avoir pris la bonne décision. Mais il n'y a pas un jour qui passe sans que je me demande ce qu'il se serait passé si j'avais fait un choix différent."

La contradiction de ses dialogues montre à quel point il lutte contre ses croyances.

#### Le Partenaire

Brad Pitt et Freeman ne s'entendent pas. Mais ce n'est pas juste une question d'attitude : **ils ont des valeurs différentes.** Freeman part. Pitt arrive. Doucement, Pitt le fait renouer avec sa passion.

**Dans l'acte 2, Pitt lui met ses mensonges en face :**

> "Tu dis que les gens s'en foutent. Je ne pense pas que tu partes pour ça. Tu veux croire à ça parce que tu pars."

Freeman casse le symbole de son apathie : le métronome qui bloque le temps.

#### L'Antagoniste

**Les croyances de l'antagoniste sont une version extrême de Freeman.** Ils pensent pareil de plein de façons.

> "Nous voyons un péché capital à chaque coin de rue et nous le tolérons. Parce que c'est courant."

Cela permet de réévaluer leurs croyances. Dans l'acte 3 : **la bataille finale**.

#### La Bataille Finale

Freeman, malgré tout, finit par dire : *"Je serai là."* Ses croyances ont changé. Pas au point de devenir optimiste total, mais au moins il ne cèdera plus à l'apathie.

**Le thème est enfin exprimé :**

> "Le monde est beau, et vaut la peine de se battre pour lui. Je suis d'accord avec la deuxième partie."

#### Conclusion

Une idée précise de son thème guide les décisions de l'histoire. Quand personnages, évolutions et contexte servent le thème, cela crée une cohérence qui rend le récit puissant.`,summary:'',flashcards:[],createdAt:'2025-01-01',updatedAt:'2025-01-01'},
{id:'s1',title:'La règle du mais / donc',category:'structure',content:`### La règle du mais / donc

*Tirée du livre "Anatomie d'un scénario"*

Dans une histoire, on raconte avec des **Mais... Donc...** plutôt que des "et puis". Ça rajoute de l'impact et de la logique causale à la narration.

---

**Le public aime 2 choses :**
- La partie **émotionnelle** : revivre ou vivre une vie
- La partie **intellectuelle** : chercher à comprendre le puzzle

Toute bonne histoire doit être composée de ces 2 parties.

---

**Mauvais exemple :**
Il entre dans la pièce *et puis* il voit un corps *et puis* il appelle la police *et puis* la police arrive.

**Bon exemple :**
Il entre dans la pièce. ***Mais*** il voit un corps. ***Donc*** il appelle la police. ***Mais*** la police ne le croit pas. ***Donc*** il doit trouver le vrai coupable seul.

Chaque "mais" crée un obstacle. Chaque "donc" crée une conséquence. C'est ce qui donne une impression de logique et d'enjeux.`,summary:'',flashcards:[],createdAt:'2025-01-01',updatedAt:'2025-01-01'},
{id:'s2',title:'Gone Girl — Lignes d\'action et triangle de scène',category:'structure',content:`### Gone Girl — Lignes d'action et triangle de scène

#### Lignes d'Action Efficaces

Les lignes d'action de Gillian Flynn sont **descriptives, concises et pleines de personnalité.**

> "Desi doesn't invite him in. Strange charge in air."
> "Desi gives him nothing."
> "Ugly Pause."
> "Nick shakes his head: bad news."

On se représente directement ce que ça veut dire. Pertinent, efficace.

#### La Dernière Ligne est le Sujet de la Scène

*"Le début de la scène montre le sujet général. La scène se concentre ensuite sur un seul point, se terminant avec la ligne la plus importante."*

Ce principe forme un **triangle** : ouverture large, resserrement progressif, fermeture sur le point le plus fort.

**Appliqué à Gone Girl :**

Ouverture : *"Nick, votre femme était-elle enceinte ?"*

Développement : Il a des problèmes d'argent. Il a augmenté l'assurance-vie d'Amy à 1,2 million.

Fermeture :
> Boney : "Elle est enceinte."
> Nick : "Je crois que j'ai besoin d'un avocat."

Le triangle représente une corde qu'on mettrait autour du cou de Nick, de plus en plus serrée. Il se finit sur un changement important : Nick réalise qu'il est dans la merde.

#### Personnage de Sous-Intrigue

*"Le personnage de sous-intrigue offre une opportunité supplémentaire de définir le héros par comparaison et de faire avancer l'histoire."*

Dans Gone Girl, l'ex-mari d'Amy a été confronté aux mêmes problèmes que Nick. Il révèle :
- Amy a un historique de manipulation (viol vs meurtre)
- *"Amy s'en est pris à Tommy quand il a cessé d'essayer d'être l'homme qu'elle voulait qu'il soit"*

Leçon pour Nick : il va devenir l'homme qu'elle veut qu'il soit. Flynn utilise encore ici la technique du triangle, step by step Nick est de plus en plus dans la merde.`,summary:'',flashcards:[],createdAt:'2025-01-01',updatedAt:'2025-01-01'},
{id:'s3',title:'Le Diable s\'habille en Prada — Les 10 premières pages',category:'structure',content:`### Le Diable s'habille en Prada — Les 10 premières pages

*"Il est essentiel d'introduire les composants de votre histoire dès le début. On a 10 pages pour attirer et retenir l'attention du lecteur."*

#### Pages 1-2 : Introduction par Comparaison

On introduit Andy par **la comparaison** : ce qui établit précisément qui elle est et surtout ce qu'elle n'est pas.

Andy se lève, miroir plein de buée. Jolie mais pas glamour, intelligente mais candide. En parallèle : 3-4 autres femmes qui se préparent. Tiroir avec 50 rouges à lèvres. Andy prend du baume à lèvres. Andy prend ses vêtements à l'arrache.

**Résultat :** En 2 pages, on sait qu'Andy est jolie, intelligente, naïve, pas intéressée par la mode. Aucun de ces traits n'est écrit.

#### Pages 3-4 : Exposition et Enjeux

**Emily** : l'inverse d'Andy. Anxieuse, fashion. Pendant tout le film, elle sera le contraste d'Andy. Elle représente ce que deviendrait Andy si elle cédait à ce monde.

Emily est guide et expose les enjeux :

> "Miranda a renvoyé les 2 dernières après 2 semaines. On a besoin de quelqu'un qui survive."
> "Un million de filles tueraient pour ce job."

**Ce job a de la valeur.** La question dramatique est posée.

#### Pages 5-6 : Présentation de l'Antagoniste via la Réaction des Autres

Le rendez-vous de Miranda est annulé. Panique générale. Tout le monde court, nettoie. Andy observe. Miranda arrive dans le hall. Les gens se poussent. On comprend : respectée, crainte, importante.

Au milieu du chaos, **Nigel** : calme, il contrôle. Il est là depuis longtemps. Ce sera le Mentor d'Andy.

#### Pages 7-8 : Rencontrer l'Antagoniste

Miranda en monologue 2 pages. Reproches et demandes accablantes.

**2 choses à retenir :** Elle est experte en mode. Elle est impossible à impressionner.

**Implication :** Andy, qui s'en fiche de la mode, va devoir impressionner Miranda.

#### Pages 9-10 : Le Conflit

> Miranda : "Vous ne lisez pas Runway et vous n'avez pas de style."

Andy s'attendait à être jugée sur ses mérites journalistiques. Elle est rejetée à cause de la mode.

Mais c'est parce qu'Andy est comme ça qu'elle peut répondre :

> Andy : "Ok, vous avez raison. Je m'y connais pas en mode. Mais je suis intelligente, j'apprends vite, et je travaillerai très dur."

**Cette scène est une version miniature du film :** Andy essaie avec ce qu'elle connaît. Miranda rejette. Andy s'adapte. Miranda accepte.`,summary:'',flashcards:[],createdAt:'2025-01-01',updatedAt:'2025-01-01'},
{id:'e1',title:'Exercice 1 — Intrigue des personnages',category:'exercices',content:`### Exercice 1 — Intrigue des personnages

*Référence : Good Will Hunting — Chapitre Psychologie des personnages*

**Objectif :** Un dialogue de 10 à 15 répliques. Une conversation ordinaire qui dérive vers quelque chose de trop proche. La défense s'active et **tient**. Le mur ne tombe pas. Ce n'est pas encore la catharsis.

---

#### Réalisation : Martin et Juliane à la piscine

Martin attend devant l'entrée. Juliane arrive en courant.

> Martin : "Hey !"
> Juliane : "Je suis vraiment désolée." *(essoufflée)*
> Martin : "Aucun souci, il fait beau, le ciel est bleu, haha." *(sourit, ça ne prend pas)* "Ça va ?"
> Juliane : "Alors on y va ?"

Les deux rentrent, se séparent, se retrouvent à la sortie. Martin attend.

Martin pour lui-même : *"Elle en met du temps."*

Juliane sort, les mains cachant ses rondeurs.

> Martin : "Je suis là, Juliane !" *(voit que quelque chose ne va pas)* "Ça va ?"
> Juliane : "Oui oui, me saoule pas." *(silence)* "Bon, on va à l'eau !"

Dans l'eau. Ils sortent pour bronzer. Juliane jette sa serviette sur elle.

> Martin : "Meuf, moi ton corps je l'aime bien. Je veux le voir — et le soleil aussi !"

Juliane est surprise mais ne dit rien. Elle ouvre progressivement la serviette. Des rires au loin. Juliane croit que c'est pour elle.

> Juliane : "Tu as des goûts de merde."
> Martin : "Tu réagis comme ça parce que tu as honte. Y'a pas de quoi avoir honte."
> Juliane : "Je savais que j'aurais pas dû venir."

Elle se lève et prend la fuite.

---

**Ce que ça démontre :** La défense s'active au moment de vulnérabilité. Face à une bienveillance explicite, le mécanisme tient quand même. Ce n'est pas encore la catharsis.`,summary:'',flashcards:[],createdAt:'2025-01-01',updatedAt:'2025-01-01'},
{id:'e2',title:'Exercice 2 — Le triangle inversé',category:'exercices',content:`### Exercice 2 — Le triangle inversé

*Référence : Gone Girl — Chapitre Structure*

**Objectif :** Une scène de 10-15 lignes. Sujet posé en ouverture, développé en escalier, fermé sur la ligne la plus importante.

---

#### Réalisation : Juliane au téléphone avec sa mère

Juliane rentre de la piscine. Sa mère l'appelle.

> Juliane : "Allô maman ? Pourquoi tu m'appelles ?"
> Mère : "Je viens de voir ton compte en banque." *(Ouverture)*

> Juliane : "T'es sérieuse ? Je t'avais dit d'arrêter de faire ça."
> Mère : "C'est pas la question. Tu es dans le rouge depuis plusieurs mois. On s'inquiète." *(Inquiétude)*

> Juliane : "Bordel, c'est pas tes affaires."
> Mère : "Ton père a regardé en détail. Tu sors énormément, alcool, soirées... C'est ça ta vie ?" *(Accusation)*

*Un silence gorgé de honte, comme une éponge trop pleine. Ses larmes montent.*

> Juliane : "Je... je..."
> Mère : "Est-ce que ça va ? Tu peux m'en parler."
> Juliane : "Parler c'est pas toujours la solution, Maman. Ne m'appelle plus." *(Fin et changement)*

Juliane raccroche. Elle pleure, téléphone encore en main.

---

**Ce que ça démontre :** Sujet (finances) → escalier (inquiétude, accusation, confrontation émotionnelle) → fermeture sur le changement. Juliane coupe le lien plutôt que de s'ouvrir.

**Prolongement possible :** Faire intervenir une grande sœur pour montrer à Juliane où elle se dirige si elle continue.`,summary:'',flashcards:[],createdAt:'2025-01-01',updatedAt:'2025-01-01'},
{id:'e3',title:'Exercice 3 — Le fantôme et la ville',category:'exercices',content:`### Exercice 3 — Le fantôme et la ville

*Référence : Seven et True Detective — Chapitre Personnage Fantôme*

**Objectif :** Ouverture d'un thriller. Monologue de 15-20 lignes. La caméra avance vers un personnage de dos. Ce qu'il dit sur la ville, c'est ce qu'il dit sur lui.

**Thème :** *On ne quitte pas ce que la ville a fait de toi, mais on peut choisir de ne pas en mourir.*

---

#### Réalisation : La femme au cimetière

Il pleut. Une scène pas triste mais sale. Des bières posées ici et là, un SDF adossé contre une tombe. Les tombes sont mal entretenues, des ordures partout. La caméra avance progressivement vers une femme de dos.

> Femme : "Je te jure, j'ai arrêté !"

> Femme : "Cette putain de ville nous a détruits. Avec ces connards qui pensent qu'à baiser. Y'en a pas un pour rattraper les autres."

*Silence.*

> Femme : "Tu as raison. Tu as toujours été là pour les défoncés, ces enflures... *(rire)* Tu te rappelles la fois où t'as broyé les couilles d'un mec parce qu'il t'avait payé un verre ? Putain, on avait rigolé."

*Silence. La caméra continue.*

> Femme : "J'espère que tu t'y plairas là-bas..."

*Un homme crie au loin et klaxonne.*

> Femme : "FERME LA !"

Elle sort un flingue sans le regarder et tire.

> Femme : "PTITE BITE VA !"

*Elle inspire, expire. Retrouve un état stable.*

> Femme : "On va bientôt se rejoindre, t'inquiète pas."

La caméra pivote. On voit une pelle dans ses mains.

> Femme : "Allez je te laisse. Bisous, petite pute."

Elle embrasse devant elle. Elle commence à creuser. CUT.

---

**Twist :** Elle est au téléphone depuis le début. Les silences = elle écoutait. Elle parle à la meilleure amie de la protagoniste.

**Dispositif du flingue à blanc :** Promesse de ne plus tuer. Le flingue à blanc est le symbole. Recontextualisé en relecture : la retenue déguisée en indifférence.

**Triple lecture de "on va bientôt se rejoindre" :**
- Mort en général
- Elle enterre quelqu'un vivant
- Elle parle à celle à qui elle a fait la promesse

> "On peut devenir quelqu'un d'autre pour quelqu'un qu'on aime. Je sais pas encore si c'est vrai, mais je suis en train d'essayer."`,summary:'',flashcards:[],createdAt:'2025-01-01',updatedAt:'2025-01-01'},
{id:'e4',title:'Exercice 4 — Décrire un personnage par comparaison',category:'exercices',content:`### Exercice 4 — Décrire un personnage par comparaison

*Référence : Le Diable s'habille en Prada — Chapitre Structure*

**Critère :** Quelqu'un lit ces 2 pages sans contexte et peut décrire le protagoniste en 3 traits, sans qu'aucun ne soit écrit explicitement.

**Thème :** relation en couple. **Les 3 traits d'Eddy :** romantique, maladroit, seul.

---

*INT — Nuit.* Eddy ouvre un tiroir plein de bougies. Il en sort quelques-unes, lumière tamisée. Il éparpille des pétales de rose pour former un chemin. En se relevant, il se cogne la tête contre le bas de son bar.

*Cut.* Julien sur un canapé, bière à la main, regarde la télé. Sa femme lui ramène une deuxième bière. Il la regarde à peine.

*Cut.* Eddy met un gant pour sortir du four un plat et se brûle les doigts. Il boit un grand verre d'eau d'une traite.

*Cut.* John ivre. Sa femme le porte jusqu'au lit. Elle se couche machinalement à côté.

*Cut.* Eddy place avec attention les petits-fours sur une assiette. Il redresse les serviettes. Pas très à l'aise, mais concentré.

*Cut.* Mickaël sort une pizza du micro-ondes, regarde son téléphone. Jette une assiette sur la table. S'assoit sans regarder sa femme.

*Cut.* Eddy renverse du vin sur lui. *Cut rapide.* Julien renverse de la bière, utilise le gilet de sa femme pour s'essuyer.

*Cut.* Eddy repasse une chemise propre. Semble rassuré.

*Cut long.* Eddy assis à table. La bouteille de vin est ouverte. Il regarde son téléphone : 22h30. La chaise en face de lui est vide. Il est seul.

*Cut.* La femme de Julien se blottit contre lui. La femme de John se met contre lui. Mickaël et sa femme mangent leur pizza.

*Cut.* Eddy baisse la tête et referme la bouteille de vin.

---

**Résultat :** Les 3 traits lisibles dans les gestes, jamais écrits.
- Romantique et méticuleux : pétales de rose, petits-fours placés avec soin, serviettes redressées
- Maladroit mais persévérant : doigts brûlés, vin renversé, chemise repassée
- Seul malgré tout : chaise vide, bouteille refermée

**Point à corriger :** Eddy n'est pas ancré comme protagoniste assez tôt. Solution : lui donner un détail d'attachement dans le premier plan avant de couper sur les autres.`,summary:'',flashcards:[],createdAt:'2025-01-01',updatedAt:'2025-01-01'}
];

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let S = {
  view: 'home',
  cat: null,
  cid: null,
  tab: 'content',
  si: 0, sf: false,
  gen: null,
  editFcId: null,
  courses: [],
  settings: { apiKey: '' }
};

// ═══════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════
async function load() {
  try {
    const s = localStorage.getItem('ec_settings');
    S.settings = s ? JSON.parse(s) : { apiKey: '' };
    const local = localStorage.getItem('ec_courses');
    if(local) {
      // localStorage existe : on l'utilise
      S.courses = JSON.parse(local);
    } else {
      // Pas de localStorage : on essaie data.json
      try {
        const res = await fetch('data.json', { cache: 'no-cache' });
        if(res.ok) {
          const data = await res.json();
          S.courses = data.courses || data;
          persist();
        } else {
          S.courses = JSON.parse(JSON.stringify(DEFAULT_COURSES));
        }
      } catch(e) {
        S.courses = JSON.parse(JSON.stringify(DEFAULT_COURSES));
      }
    }
  } catch(e) {
    S.courses = JSON.parse(JSON.stringify(DEFAULT_COURSES));
    S.settings = { apiKey: '' };
  }
}
function persist() {
  localStorage.setItem('ec_courses', JSON.stringify(S.courses));
  localStorage.setItem('ec_settings', JSON.stringify(S.settings));
}

// ═══════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════
function sv(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  S.view = name;
  updateBC();
  window.scrollTo(0,0);
}

function goHome() {
  S.cat = null; S.cid = null;
  sv('home'); renderHome();
}
function goCategory(cat) {
  S.cat = cat; S.cid = null;
  sv('category'); renderCat();
}
function goCourse(id) {
  S.cid = id; S.tab = 'content';
  sv('course'); renderCourse();
}
function goStudy() {
  S.si = 0; S.sf = false;
  sv('study'); renderStudy();
}

function catLabel(c) { return {personnage:'Personnage',structure:'Structure',realisateur:'Realisateur',exercices:'Exercices'}[c]||c; }

function updateBC() {
  const el = document.getElementById('breadcrumb');
  const parts = [];
  if(S.cat) parts.push(`/ <span class="crumb" onclick="goCategory('${S.cat}')">${catLabel(S.cat)}</span>`);
  if(S.cid) { const c=getCourse(S.cid); if(c) parts.push(`/ <span>${trunc(c.title,28)}</span>`); }
  if(S.view==='study') parts.push('/ <span>Révision</span>');
  el.innerHTML = parts.join(' ');
}

// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════
function getCourse(id) { return S.courses.find(c=>c.id===id); }
function byCat(cat) { return S.courses.filter(c=>c.category===cat); }
function uid() { return Date.now().toString(36)+Math.random().toString(36).substr(2); }
function trunc(s,n) { return s.length>n?s.substring(0,n)+'…':s; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ═══════════════════════════════════════════════
// MARKDOWN
// ═══════════════════════════════════════════════
function md(text) {
  if(!text) return '';
  const lines = text.split('\n');
  let html = '', inBQ = false;
  for(let l of lines) {
    if(l.startsWith('### ')) { if(inBQ){html+='</blockquote>';inBQ=false;} html+=`<h3>${inl(l.slice(4))}</h3>`; continue; }
    if(l.startsWith('#### ')) { if(inBQ){html+='</blockquote>';inBQ=false;} html+=`<h4>${inl(l.slice(5))}</h4>`; continue; }
    if(l.trim()==='---') { if(inBQ){html+='</blockquote>';inBQ=false;} html+='<hr>'; continue; }
    if(l.startsWith('> ')) {
      if(!inBQ){html+='<blockquote>';inBQ=true;} else html+='<br>';
      html+=inl(l.slice(2)); continue;
    }
    if(l.trim()==='') { if(inBQ){html+='</blockquote>';inBQ=false;} html+='<br>'; continue; }
    if(inBQ){html+='</blockquote>';inBQ=false;}
    html+=`<p>${inl(l)}</p>`;
  }
  if(inBQ) html+='</blockquote>';
  return html;
}
function inl(t) {
  return t
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1" style="max-width:100%;border-radius:2px;margin:.5rem 0;display:block">')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>');
}

// ═══════════════════════════════════════════════
// RENDER HOME
// ═══════════════════════════════════════════════
function renderHome() {
  const descs = {personnage:'Psychologie, trauma, défenses, catharsis',structure:'Triangle, lignes d\'action, construction',exercices:'Scènes écrites, réalisations pratiques'};
  document.getElementById('cat-grid').innerHTML = ['personnage','structure','realisateur','exercices'].map((cat,i)=>{
    const cnt = byCat(cat).length;
    return `<div class="cat-card" data-c="${cat}" onclick="goCategory('${cat}')">
      <div class="cat-idx">0${i+1}</div>
      <div class="cat-name">${catLabel(cat)}</div>
      <div class="cat-desc">${descs[cat]}</div>
      <div class="cat-cnt">${cnt} cours</div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════
// RENDER CATEGORY
// ═══════════════════════════════════════════════
function renderCat() {
  const cat = S.cat;
  document.getElementById('cv-title').textContent = catLabel(cat);
  const courses = byCat(cat);
  const list = document.getElementById('c-list');
  if(!courses.length) {
    list.innerHTML = `<div class="empty"><p>Aucun cours dans cette catégorie.</p></div>`;
  } else {
    list.innerHTML = courses.map((c,i)=>`
      <div class="c-item" onclick="goCourse('${c.id}')">
        <div class="c-item-l">
          <div class="c-item-idx">Cours ${String(i+1).padStart(2,'0')}</div>
          <div class="c-item-title">${esc(c.title)}</div>
          <div class="c-item-meta">${c.flashcards.length} flashcard${c.flashcards.length!==1?'s':''}</div>
        </div>
        <div class="c-item-actions">
          <button class="ibtn" onclick="event.stopPropagation();openEdit('${c.id}')" title="Modifier">✎</button>
          <button class="ibtn" style="color:var(--red)" onclick="event.stopPropagation();delCourse('${c.id}')" title="Supprimer">✕</button>
        </div>
      </div>`).join('');
  }
  document.getElementById('add-btn').onclick = ()=>openEdit(null);
}

// ═══════════════════════════════════════════════
// RENDER COURSE
// ═══════════════════════════════════════════════
function renderCourse() {
  const c = getCourse(S.cid); if(!c) return;
  document.getElementById('course-meta').innerHTML = `
    <span class="ctag ${c.category}">${catLabel(c.category)}</span>
    <span>${c.flashcards.length} flashcard${c.flashcards.length!==1?'s':''}</span>
    <span style="margin-left:auto;display:flex;gap:.4rem">
      <button class="btn" onclick="openEdit('${c.id}')">Modifier</button>
    </span>`;
  document.getElementById('course-title').textContent = c.title;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===S.tab));
  renderTab();
}

function switchTab(tab) {
  S.tab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  renderTab();
}

function renderTab() {
  const c = getCourse(S.cid); if(!c) return;
  const el = document.getElementById('tab-content');
  if(S.tab==='content') {
    el.innerHTML = `<div class="course-content">${md(c.content)}</div>`;
  } else if(S.tab==='summary') {
    renderSummary(c, el);
  } else {
    renderFC(c, el);
  }
}

// ═══════════════════════════════════════════════
// SUMMARY TAB
// ═══════════════════════════════════════════════
function renderSummary(c, el) {
  if(S.gen==='summary') { el.innerHTML=`<div class="generating"><div class="dot-pulse"><span></span><span></span><span></span></div>Génération du résumé…</div>`; return; }
  if(c.summary) {
    el.innerHTML = `
      <div class="sum-header">
        <span style="font-family:var(--fm);font-size:10px;letter-spacing:.15em;color:var(--text-muted);text-transform:uppercase">Résumé</span>
        <div style="display:flex;gap:.4rem">
          <button class="btn" onclick="openEdit('${c.id}')">Modifier</button>
          <button class="btn btn-accent" onclick="genSummary('${c.id}')">Régénérer</button>
        </div>
      </div>
      <div class="sum-content">${md(c.summary)}</div>`;
  } else {
    el.innerHTML = `<div class="empty"><p>Pas encore de résumé pour ce cours.</p><div class="empty-btns"><button class="btn btn-accent" onclick="genSummary('${c.id}')">✦ Générer via Claude</button><button class="btn" onclick="openEdit('${c.id}')">Écrire manuellement</button></div></div>`;
  }
}

// ═══════════════════════════════════════════════
// FLASHCARDS TAB
// ═══════════════════════════════════════════════
function renderFC(c, el) {
  if(S.gen==='flashcards') { el.innerHTML=`<div class="generating"><div class="dot-pulse"><span></span><span></span><span></span></div>Génération des flashcards…</div>`; return; }
  if(c.flashcards.length) {
    el.innerHTML = `
      <div class="fc-header">
        <span class="fc-cnt">${c.flashcards.length} flashcard${c.flashcards.length!==1?'s':''}</span>
        <div class="fc-actions">
          <button class="btn" onclick="genFC('${c.id}')">Régénérer</button>
          <button class="btn btn-accent" onclick="goStudy()">Réviser</button>
        </div>
      </div>
      <div class="fc-list">${c.flashcards.map(fc=>fcItem(fc,c.id)).join('')}</div>
      <div style="margin-top:1.5rem"><button class="btn" onclick="addFC('${c.id}')">+ Ajouter une flashcard</button></div>`;
  } else {
    el.innerHTML = `<div class="empty"><p>Pas encore de flashcards pour ce cours.</p><div class="empty-btns"><button class="btn btn-accent" onclick="genFC('${c.id}')">✦ Générer via Claude</button><button class="btn" onclick="addFC('${c.id}')">Ajouter manuellement</button></div></div>`;
  }
}

function fcItem(fc, cid) {
  if(S.editFcId===fc.id) {
    return `<div class="fc-item" id="fc-${fc.id}"><div class="fc-editor">
      <div class="fg" style="margin-bottom:1rem"><label>Question</label><textarea class="fta" id="fcq-${fc.id}" style="min-height:70px">${esc(fc.question)}</textarea></div>
      <div class="fg" style="margin-bottom:1rem"><label>Réponse</label><textarea class="fta" id="fca-${fc.id}" style="min-height:70px">${esc(fc.answer)}</textarea></div>
      <div style="display:flex;gap:.4rem;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="cancelFcEdit()">Annuler</button>
        <button class="btn btn-accent" onclick="saveFcEdit('${cid}','${fc.id}')">Sauvegarder</button>
      </div>
    </div></div>`;
  }
  return `<div class="fc-item" id="fc-${fc.id}">
    <div class="fc-q"><div style="display:flex;align-items:flex-start;gap:.5rem;flex:1"><span class="fc-ql">Q</span><span>${esc(fc.question)}</span></div>
      <div style="display:flex;gap:.2rem;flex-shrink:0">
        <button class="ibtn" onclick="startFcEdit('${fc.id}')" title="Modifier">✎</button>
        <button class="ibtn" style="color:var(--red)" onclick="delFC('${cid}','${fc.id}')" title="Supprimer">✕</button>
      </div>
    </div>
    <div class="fc-a"><span class="fc-al">R</span><span>${esc(fc.answer)}</span></div>
  </div>`;
}

function startFcEdit(id) { S.editFcId=id; renderTab(); }
function cancelFcEdit() { S.editFcId=null; renderTab(); }
function saveFcEdit(cid, fid) {
  const q = document.getElementById('fcq-'+fid).value.trim();
  const a = document.getElementById('fca-'+fid).value.trim();
  if(!q||!a){ toast('Question et réponse requises','error'); return; }
  const c = getCourse(cid);
  const idx = c.flashcards.findIndex(f=>f.id===fid);
  if(idx!==-1) c.flashcards[idx]={...c.flashcards[idx],question:q,answer:a};
  persist(); S.editFcId=null; renderTab(); toast('Flashcard sauvegardée','success');
}
function addFC(cid) {
  const c = getCourse(cid);
  const nfc = {id:uid(),question:'',answer:''};
  c.flashcards.push(nfc); persist();
  S.editFcId = nfc.id; renderTab();
}
function delFC(cid, fid) {
  if(!confirm('Supprimer cette flashcard ?')) return;
  const c = getCourse(cid);
  c.flashcards = c.flashcards.filter(f=>f.id!==fid);
  persist(); renderTab(); toast('Flashcard supprimée');
}

// ═══════════════════════════════════════════════
// STUDY MODE
// ═══════════════════════════════════════════════
function renderStudy() {
  const c = getCourse(S.cid);
  if(!c||!c.flashcards.length){ sv('course'); return; }
  const cards = c.flashcards, i=S.si, card=cards[i];
  document.getElementById('study-inner').innerHTML = `
    <div class="study-prog">${i+1} / ${cards.length}</div>
    <div class="study-card ${S.sf?'flipped':''}" id="scard" onclick="flipCard()">
      <div class="study-card-inner">
        <div class="study-f">
          <div class="study-label">Question</div>
          <div class="study-text">${esc(card.question)}</div>
        </div>
        <div class="study-b">
          <div class="study-label">Réponse</div>
          <div class="study-text">${esc(card.answer)}</div>
        </div>
      </div>
    </div>
    <div class="study-hint">${S.sf?'':' Cliquer pour révéler'}</div>
    <div class="study-ctrl">
      <button class="btn" onclick="prevCard()" ${i===0?'disabled':''}>← Précédent</button>
      ${i<cards.length-1?`<button class="btn btn-accent" onclick="nextCard()">Suivant →</button>`:`<button class="btn btn-accent" onclick="goCourse('${c.id}')">Terminer ✓</button>`}
    </div>
    <div style="margin-top:1.5rem"><button class="btn btn-ghost" onclick="goCourse('${c.id}')">Retour au cours</button></div>`;
}
function flipCard() { S.sf=!S.sf; renderStudy(); }
function nextCard() { const c=getCourse(S.cid); if(S.si<c.flashcards.length-1){S.si++;S.sf=false;renderStudy();} }
function prevCard() { if(S.si>0){S.si--;S.sf=false;renderStudy();} }

// ═══════════════════════════════════════════════
// EDIT MODAL
// ═══════════════════════════════════════════════
function openEdit(cid) {
  if(cid) {
    const c=getCourse(cid);
    document.getElementById('edit-modal-title').textContent='Modifier le cours';
    document.getElementById('edit-id').value=cid;
    document.getElementById('edit-title').value=c.title;
    document.getElementById('edit-cat').value=c.category;
    document.getElementById('edit-content').value=c.content;
    document.getElementById('edit-summary').value=c.summary||'';
  } else {
    document.getElementById('edit-modal-title').textContent='Ajouter un cours';
    document.getElementById('edit-id').value='';
    document.getElementById('edit-title').value='';
    document.getElementById('edit-cat').value=S.cat||'personnage';
    document.getElementById('edit-content').value='';
    document.getElementById('edit-summary').value='';
  }
  document.getElementById('edit-overlay').classList.add('open');
}
function closeEdit() { document.getElementById('edit-overlay').classList.remove('open'); }
function saveEdit() {
  const id=document.getElementById('edit-id').value;
  const title=document.getElementById('edit-title').value.trim();
  const category=document.getElementById('edit-cat').value;
  const content=document.getElementById('edit-content').value;
  const summary=document.getElementById('edit-summary').value;
  if(!title){ toast('Le titre est requis','error'); return; }
  if(id) {
    const idx=S.courses.findIndex(c=>c.id===id);
    if(idx!==-1) S.courses[idx]={...S.courses[idx],title,category,content,summary,updatedAt:new Date().toISOString()};
  } else {
    S.courses.push({id:uid(),title,category,content,summary,flashcards:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
  }
  persist(); closeEdit(); toast('Cours sauvegardé','success');
  if(S.view==='category') renderCat();
  else if(S.view==='course') renderCourse();
  else renderHome();
}
function delCourse(id) {
  if(!confirm('Supprimer ce cours ?')) return;
  S.courses=S.courses.filter(c=>c.id!==id);
  persist(); toast('Cours supprimé');
  if(S.view==='course') goCategory(S.cat);
  else renderCat();
}

// ═══════════════════════════════════════════════
// SETTINGS
// ═══════════════════════════════════════════════
function openSettings() {
  document.getElementById('set-api-key').value=S.settings.apiKey||'';
  document.getElementById('settings-overlay').classList.add('open');
}
function closeSettings() { document.getElementById('settings-overlay').classList.remove('open'); }
function saveSettings() {
  S.settings.apiKey=document.getElementById('set-api-key').value.trim();
  persist(); closeSettings(); toast('Paramètres sauvegardés','success');
}
function confirmReset() {
  if(confirm('Réinitialiser tous les cours ? Action irréversible.')) {
    S.courses=JSON.parse(JSON.stringify(DEFAULT_COURSES));
    persist(); closeSettings(); goHome(); renderHome(); toast('Données réinitialisées');
  }
}

// ═══════════════════════════════════════════════
// CLAUDE API
// ═══════════════════════════════════════════════
async function genFC(cid) {
  if(!S.settings.apiKey){ toast('Clé API requise','error'); openSettings(); return; }
  const c=getCourse(cid); S.gen='flashcards'; renderTab();
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':S.settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:1500,
        messages:[{role:'user',content:`Tu es un assistant pédagogique expert en écriture cinématographique.

À partir du cours ci-dessous, génère entre 5 et 8 flashcards de révision pertinentes.

RÈGLES :
- Questions qui testent la compréhension, pas juste la mémorisation
- Réponses concises (1-3 phrases max)
- Couvre les concepts clés du cours

Réponds UNIQUEMENT en JSON valide, sans backticks ni texte supplémentaire :
{"flashcards":[{"question":"...","answer":"..."}]}

COURS :
${c.content}`}]
      })
    });
    const data=await res.json();
    if(data.error) throw new Error(data.error.message);
    const parsed=JSON.parse(data.content[0].text.trim());
    c.flashcards=parsed.flashcards.map(f=>({id:uid(),question:f.question,answer:f.answer}));
    persist(); toast(`${c.flashcards.length} flashcards générées`,'success');
  } catch(e) { console.error(e); toast('Erreur : '+e.message,'error'); }
  S.gen=null; renderTab();
}

async function genSummary(cid) {
  if(!S.settings.apiKey){ toast('Clé API requise','error'); openSettings(); return; }
  const c=getCourse(cid); S.gen='summary'; renderTab();
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':S.settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:800,
        messages:[{role:'user',content:`Tu es un assistant pédagogique expert en écriture cinématographique.

Génère un résumé concis et structuré du cours ci-dessous. 4 à 6 points clés, formulés clairement. Utilise #### pour les titres si pertinent.

Réponds UNIQUEMENT avec le texte du résumé en markdown simple, directement (pas de JSON, pas de backticks).

COURS :
${c.content}`}]
      })
    });
    const data=await res.json();
    if(data.error) throw new Error(data.error.message);
    c.summary=data.content[0].text.trim();
    persist(); toast('Résumé généré','success');
  } catch(e) { console.error(e); toast('Erreur : '+e.message,'error'); }
  S.gen=null; renderTab();
}

// ═══════════════════════════════════════════════
// IMPORT / EXPORT
// ═══════════════════════════════════════════════
function exportData() {
  const blob=new Blob([JSON.stringify({courses:S.courses,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url; a.download='ecriture-'+new Date().toISOString().split('T')[0]+'.json';
  a.click(); URL.revokeObjectURL(url); toast('Export téléchargé','success');
}
function importData(input) {
  const file=input.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=e=>{
    try {
      const data=JSON.parse(e.target.result);
      if(data.courses&&Array.isArray(data.courses)) {
        if(confirm(`Importer ${data.courses.length} cours ? Les cours existants seront remplacés.`)) {
          S.courses=data.courses; persist(); goHome(); renderHome(); toast(`${data.courses.length} cours importés`,'success');
        }
      } else { toast('Format invalide','error'); }
    } catch(err) { toast('Erreur de lecture','error'); }
  };
  r.readAsText(file); input.value='';
}

// ═══════════════════════════════════════════════
// MODALS & TOAST
// ═══════════════════════════════════════════════
function overlayClick(e,id) { if(e.target.id===id) document.getElementById(id).classList.remove('open'); }
let toastT;
function toast(msg,type='') {
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast show'+(type?' '+type:'');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2400);
}

// ═══════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(S.view==='study') {
    if(e.key===' '||e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();flipCard();}
    else if(e.key==='ArrowRight') nextCard();
    else if(e.key==='ArrowLeft') prevCard();
  }
  if(e.key==='Escape') document.querySelectorAll('.overlay.open').forEach(m=>m.classList.remove('open'));
});

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
load().then(renderHome);
</script>

</html>
